# Hyprland settings for the PSLDM screen locker.
# Add this line to ~/.config/hypr/hyprland.conf:
#     source = /path/to/psldm-lock.conf

# Lock the session with SUPER + L.
bind = SUPER, L, exec, pgrep -x psldm-lock || psldm-lock

# hypridle can call the same command. Use `lock_cmd` in ~/.config/hypr/
# hypridle.conf, and keep the pgrep guard, so that one lock surface runs at a
# time.

# Let a new locker take over a lock whose program died.
#
# Without this, Hyprland keeps the screen locked and shows its own message,
# and no program can accept your password. You then need a text console to
# recover the session. With it, running psldm-lock again brings the password
# field back.
misc {
    allow_session_lock_restore = true
}
