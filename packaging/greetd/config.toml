# greetd configuration for the PSLDM greeter.
# Install it at /etc/greetd/config.toml.
#
# greetd runs as root. It owns PAM, and it starts the user session. The
# greeter runs as the unprivileged user `greeter`.

[terminal]
vt = 1

[default_session]
# The script starts Hyprland, which holds the greeter. It also erases the
# console when the compositor stops, so that the login does not show a text
# screen before the session starts.
command = "/usr/bin/psldm-greeter-session"
user = "greeter"
