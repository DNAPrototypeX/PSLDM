[workspace]
resolver = "3"
members = [
    "crates/psldm-auth",
    "crates/psldm-session",
    "crates/psldm-ui",
    "crates/psldm-greet",
    "crates/psldm-lock",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Paul Moore"]

[workspace.dependencies]
psldm-auth = { path = "crates/psldm-auth" }
psldm-session = { path = "crates/psldm-session" }
psldm-ui = { path = "crates/psldm-ui" }

freedesktop_entry_parser = "2.0.1"
gtk = { version = "0.10", package = "gtk4", features = ["v4_12"] }
glob = "0.3"
greetd_ipc = { version = "0.10", features = ["tokio-codec"] }
lru = "0.18"
pam = { version = "0.8", features = ["client"] }
serde = { version = "1.0", features = ["derive"] }
shlex = "1.3"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "macros", "net", "rt", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
zbus = { version = "5.10", features = ["tokio"], default-features = false }
